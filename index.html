<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grabbies — Smart Vending Machines for Offices, Gyms & Campuses | Delhi NCR</title>
    <meta name="description" content="Grabbies places, manages and restocks cashless smart vending machines across Delhi NCR — zero setup cost for venues, dedicated machines for corporates, and a franchise opportunity for entrepreneurs." />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static hidden form so Netlify's build-time bot can detect the form fields.
      Netlify scans this actual HTML file at deploy time (it can't see the
      React-rendered version), then the real form in Contact.tsx submits to it.
      This must never be shown to visitors — kept hidden via inline style below.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" style="display: none;">
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <select name="type"><option>placeholder</option></select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
